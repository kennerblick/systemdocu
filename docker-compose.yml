services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-systemdocu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-systemdocu}
      POSTGRES_DB: ${POSTGRES_DB:-systemdocu}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-systemdocu} -d ${POSTGRES_DB:-systemdocu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-systemdocu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-systemdocu}
      POSTGRES_DB: ${POSTGRES_DB:-systemdocu}
      POSTGRES_HOST: postgres
      ZABBIX_URL: ${ZABBIX_URL:-}
      ZABBIX_USER: ${ZABBIX_USER:-}
      ZABBIX_PASSWORD: ${ZABBIX_PASSWORD:-}
      ZABBIX_API_TOKEN: ${ZABBIX_API_TOKEN:-}
      ZABBIX_VERIFY_SSL: ${ZABBIX_VERIFY_SSL:-false}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin}
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "9191:80"
    depends_on:
      - backend
    networks:
      - internal

  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-systemdocu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-systemdocu}
      POSTGRES_DB: ${POSTGRES_DB:-systemdocu}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    networks:
      - internal

networks:
  internal:
    driver: bridge
